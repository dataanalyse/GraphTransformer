graph:
  type: tiered_scale_free
  sizes: [40]

seeds: [7]

prediction_horizon: 5

simulator:
  T: 200
  p_shock: 0.05
  p_propagate: 0.35
  p_recover: 0.25

features:
  # Feature order is explicit and should be preserved by the builder:
  # 1. health
  # 2. exposure
  # 3. time_to_recovery
  # 4. betweenness_centrality
  # The saved tensor currently contains the first three enabled features.
  # betweenness_centrality is still appended at Graphormer training time
  # so the default v1 behavior is preserved while models stay unchanged.
  use_health: true
  use_exposure: true
  use_time_to_recovery: true
  use_betweenness: true

training:
  baseline:
    enabled: true
    lr: 0.05
    epochs: 200
    eval_every: 50
  gcn:
    enabled: true
    lr: 0.01
    epochs: 300
    eval_every: 50
    hidden_dim: 16
  graph_transformer:
    enabled: true
    lr: 0.005
    epochs: 300
    eval_every: 50
    d_model: 32
    num_heads: 4
    num_layers: 2
    ff_dim: 64
    dropout: 0.1
  graph_transformer_pyg:
    enabled: false
    lr: 0.005
    epochs: 300
    eval_every: 50
    hidden_dim: 32
    num_heads: 4
    num_layers: 2
    dropout: 0.1
  graphormer:
    enabled: true
    lr: 0.005
    epochs: 300
    eval_every: 50
    d_model: 32
    num_heads: 4
    num_layers: 2
    ff_dim: 64
    dropout: 0.1
    max_dist: 4
    max_degree: 16
  baseline_graph_level:
    enabled: true
    lr: 0.01
    epochs: 200
    eval_every: 50
  graph_transformer_graph_level:
    enabled: true
    lr: 0.005
    epochs: 300
    eval_every: 50
    d_model: 32
    num_heads: 4
    num_layers: 2
    ff_dim: 64
    dropout: 0.1
  gcn_graph_level:
    enabled: true
    lr: 0.01
    epochs: 300
    eval_every: 50
    hidden_dim: 16
  graphormer_graph_level:
    enabled: true
    lr: 0.005
    epochs: 300
    eval_every: 50
    d_model: 32
    num_heads: 4
    num_layers: 2
    ff_dim: 64
    dropout: 0.1
    max_dist: 4
    max_degree: 16

data_root: data
run_root: runs
